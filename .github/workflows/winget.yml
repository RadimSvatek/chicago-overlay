name: Publish to winget-pkgs

on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: RadimSvatek.ChicagoOverlay
          installers-regex: 'chicago_overlay_.*\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
